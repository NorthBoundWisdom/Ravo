name: Ravo CI bootstrap
description: Shared Qt/host/PATH/FreeCM/cache preparation for build and package jobs

inputs:
  platform:
    description: prepare_ci_lock platform (mac|linux|win)
    required: true
  preset:
    description: CMake preset name
    required: true
  host_packages:
    description: Host package mode (brew|cmake|cmake-png)
    required: true
  build_type:
    description: Host package / ccache build type (Debug|Release)
    required: true
  runtime_dll:
    description: Windows runtime DLL basename to verify under ci-prefix/bin
    required: false
    default: ""
  install_python:
    description: Whether to run actions/setup-python
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up Python
      if: inputs.install_python == 'true'
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Enable long paths
      if: runner.os == 'Windows'
      shell: bash
      run: git config --global core.longpaths true

    - name: MSVC environment
      if: runner.os == 'Windows'
      shell: pwsh
      run: .github/scripts/setup_msvc_environment.ps1

    - name: Install macOS packages
      if: runner.os == 'macOS'
      shell: bash
      env:
        HOMEBREW_NO_AUTO_UPDATE: "1"
        HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
      run: |
        set -euo pipefail
        brew_repo="$(brew --repository)"
        if [[ -d "${brew_repo}/Library/Taps/aws/homebrew-tap" ]]; then
          brew untap aws/tap
        fi
        brew install ninja pkg-config libpng

    - name: Install Linux packages
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        # GitHub-hosted images ship a Google Chrome apt source that periodically
        # fails apt-get update with Hash Sum mismatch and aborts the whole job.
        # Ravo does not need that repo for bootstrap packages.
        sudo rm -f /etc/apt/sources.list.d/google-chrome.list           /etc/apt/sources.list.d/google-chrome*.list || true
        sudo apt-get update
        sudo apt-get install -y ninja-build clang pkg-config libpng-dev zlib1g-dev

    - name: Install Windows Ninja
      if: runner.os == 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        choco install ninja -y --no-progress
        echo "/c/ProgramData/chocolatey/bin" >> "$GITHUB_PATH"

    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2.24
      with:
        key: ${{ inputs.preset }}-${{ runner.os }}
        restore-keys: ${{ inputs.preset }}-${{ runner.os }}

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        modules: qtimageformats qtshadertools
        cache: true
        cache-key-prefix: qt-imageformats-shadertools-${{ env.QT_VERSION }}-${{ runner.os }}
        setup-python: false
        install-deps: true
        # PyPI aqt 3.3.0 cannot resolve the Qt 6.11 Windows repository layout.
        aqtsource: git+https://github.com/miurahr/aqtinstall.git@16db45a70b5905ad596941b223469bc86a56901e

    - name: Put Qt binaries on PATH
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        if [[ -z "${QT_ROOT_DIR:-}" ]]; then
          echo "QT_ROOT_DIR was not set by install-qt-action" >&2
          exit 1
        fi
        qt_bin="${QT_ROOT_DIR}/bin"
        if [[ ! -d "${qt_bin}" ]]; then
          echo "Qt bin directory is missing: ${qt_bin}" >&2
          exit 1
        fi
        echo "${qt_bin}" >> "$GITHUB_PATH"

    - name: Put Qt binaries on Windows PATH
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        if (-not $env:QT_ROOT_DIR) {
          throw "QT_ROOT_DIR was not set by install-qt-action"
        }
        $qtBin = Join-Path $env:QT_ROOT_DIR "bin"
        if (-not (Test-Path $qtBin)) {
          throw "Qt bin directory is missing: $qtBin"
        }
        Add-Content -Path $env:GITHUB_PATH -Value $qtBin
        Add-Content -Path $env:GITHUB_ENV -Value ("Path={0};{1}" -f $qtBin, $env:Path)

    - name: Install host CMake packages
      shell: bash
      run: |
        set -euo pipefail
        args=(
          --prefix "${RUNNER_TEMP}/ci-prefix"
          --work-dir "${RUNNER_TEMP}/ci-host"
          --build-type "${{ inputs.build_type }}"
        )
        if [[ "${{ inputs.host_packages }}" == "cmake-png" ]]; then
          args+=(--with-png-zlib)
        fi
        python .github/scripts/install_host_packages.py "${args[@]}"

    - name: Persist Windows host PATH
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        RAVO_RUNTIME_DLL: ${{ inputs.runtime_dll }}
      run: |
        $qtBin = Join-Path $env:QT_ROOT_DIR "bin"
        $hostBin = Join-Path $env:RUNNER_TEMP "ci-prefix\bin"
        if (-not (Test-Path $qtBin)) {
          throw "Qt bin directory is missing: $qtBin"
        }
        if ($env:RAVO_RUNTIME_DLL) {
          $zlib = Join-Path $hostBin $env:RAVO_RUNTIME_DLL
          if (-not (Test-Path $zlib)) {
            throw "zlib runtime is missing: $zlib"
          }
        }
        $env:Path = "$qtBin;$hostBin;$env:Path"
        Add-Content -Path $env:GITHUB_PATH -Value $qtBin
        Add-Content -Path $env:GITHUB_PATH -Value $hostBin
        Add-Content -Path $env:GITHUB_ENV -Value ("Path={0}" -f $env:Path)

    - name: Allow HTTPS clones of GitHub SSH remotes
      shell: bash
      run: |
        set -euo pipefail
        git config --global url."https://github.com/".insteadOf "git@github.com:"
        if [[ -n "${GEOCONTROLS_TOKEN:-}" ]]; then
          git config --global url."https://x-access-token:${GEOCONTROLS_TOKEN}@github.com/".insteadOf "https://github.com/"
        fi

    - name: Cache FreeCM seed repositories
      uses: actions/cache@v5
      with:
        path: build/dependency_seed_repos
        key: seeds-v2-${{ runner.os }}-${{ hashFiles('source_roots.lock.jsonc.in') }}
        restore-keys: seeds-v2-${{ runner.os }}-

    - name: Materialize source roots
      shell: bash
      run: |
        set -euo pipefail
        if [[ -z "${QT_ROOT_DIR:-}" ]]; then
          echo "QT_ROOT_DIR was not set by install-qt-action" >&2
          exit 1
        fi
        python configs/source_root_workflow.py --init
        prefix_args=(--prefix-path "${QT_ROOT_DIR}" --prefix-path "${RUNNER_TEMP}/ci-prefix")
        path_args=(--path-entry "${QT_ROOT_DIR}/bin" --path-entry "${RUNNER_TEMP}/ci-prefix/bin")
        if [[ "${{ runner.os }}" == "macOS" ]]; then
          prefix_args+=(--prefix-path "$(brew --prefix)" --prefix-path "$(brew --prefix zlib)")
          path_args+=(--path-entry "$(brew --prefix)/bin")
        fi
        prepare_args=(
          --repo-root . \
          --platform "${{ inputs.platform }}" \
          "${prefix_args[@]}" \
          "${path_args[@]}"
        )
        if [[ "${{ runner.os }}" == "Windows" ]]; then
          prepare_args+=(--runtime-search-path "${VCToolsRedistDir}/x64/Microsoft.VC143.CRT")
        fi
        python .github/scripts/prepare_ci_lock.py "${prepare_args[@]}"
        python configs/source_root_workflow.py --update
        python configs/source_roots.py show --format json
        python configs/source_roots.py resolve --format json
        python configs/source_roots.py verify
        python .github/scripts/prepare_ci_lock.py \
          --repo-root . \
          --check-preset \
          --preset "${{ inputs.preset }}" \
          "${path_args[@]}"
