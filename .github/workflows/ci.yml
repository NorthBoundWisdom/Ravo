name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.11.2"
  QT_QPA_PLATFORM: offscreen

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check whitespace
        run: git diff --check

      - name: Validate FreeCM project commands
        run: python FreeCM/tools/validate_repo_commands.py .

      - name: Check CI lock rewrite
        run: python .github/scripts/prepare_ci_lock.py --self-check

      - name: Run Ravo static contracts
        run: |
          set -euo pipefail
          python Ravo/tools/freeze_legacy_manifest.py --check
          python Ravo/tools/check_capability_inventory.py
          python Ravo/tools/check_freeze_reference.py
          python Ravo/tools/check_ravo_dependency_boundary.py
          python Ravo/tools/check_vertical_slice_plan.py
          python Ravo/tools/check_fixture_classification_ledger.py

  build:
    name: ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            preset: mac_clang_debug
            platform: mac
            host_packages: brew
          - os: ubuntu-24.04
            preset: linux_clang_debug
            platform: linux
            host_packages: cmake
          - os: windows-2022
            preset: win_msvc_debug
            platform: win
            host_packages: cmake-png
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enable long paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install macOS packages
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
        run: brew install ninja pkg-config libpng

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build clang pkg-config libpng-dev zlib1g-dev

      - name: Install Windows Ninja
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          choco install ninja -y --no-progress
          echo "/c/ProgramData/chocolatey/bin" >> "$GITHUB_PATH"

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.preset }}-${{ runner.os }}
          restore-keys: ${{ matrix.preset }}-${{ runner.os }}

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
          cache-key-prefix: qt-${{ env.QT_VERSION }}-${{ runner.os }}
          setup-python: false
          install-deps: true
          # PyPI aqt 3.3.0 cannot resolve the Qt 6.11 Windows repository layout.
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@16db45a70b5905ad596941b223469bc86a56901e

      - name: Put Qt binaries on PATH
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          if [[ -z "${QT_ROOT_DIR:-}" ]]; then
            echo "QT_ROOT_DIR was not set by install-qt-action" >&2
            exit 1
          fi
          qt_bin="${QT_ROOT_DIR}/bin"
          if [[ ! -d "${qt_bin}" ]]; then
            echo "Qt bin directory is missing: ${qt_bin}" >&2
            exit 1
          fi
          echo "${qt_bin}" >> "$GITHUB_PATH"

      - name: Put Qt binaries on Windows PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not $env:QT_ROOT_DIR) {
            throw "QT_ROOT_DIR was not set by install-qt-action"
          }
          $qtBin = Join-Path $env:QT_ROOT_DIR "bin"
          if (-not (Test-Path $qtBin)) {
            throw "Qt bin directory is missing: $qtBin"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $qtBin
          Add-Content -Path $env:GITHUB_ENV -Value ("Path={0};{1}" -f $qtBin, $env:Path)

      - name: Install host CMake packages
        run: |
          set -euo pipefail
          args=(
            --prefix "${RUNNER_TEMP}/ci-prefix"
            --work-dir "${RUNNER_TEMP}/ci-host"
            --build-type Debug
          )
          if [[ "${{ matrix.host_packages }}" == "cmake-png" ]]; then
            args+=(--with-png-zlib)
          fi
          python .github/scripts/install_host_packages.py "${args[@]}"

      - name: Persist Windows host PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $qtBin = Join-Path $env:QT_ROOT_DIR "bin"
          $hostBin = Join-Path $env:RUNNER_TEMP "ci-prefix\bin"
          $zlib = Join-Path $hostBin "zlibd.dll"
          if (-not (Test-Path $qtBin)) {
            throw "Qt bin directory is missing: $qtBin"
          }
          if (-not (Test-Path $zlib)) {
            throw "zlibd.dll is missing: $zlib"
          }
          $env:Path = "$qtBin;$hostBin;$env:Path"
          Add-Content -Path $env:GITHUB_PATH -Value $qtBin
          Add-Content -Path $env:GITHUB_PATH -Value $hostBin
          Add-Content -Path $env:GITHUB_ENV -Value ("Path={0}" -f $env:Path)

      - name: Allow HTTPS clones of GitHub SSH remotes
        env:
          GEOCONTROLS_TOKEN: ${{ secrets.GEOCONTROLS_TOKEN }}
        run: |
          set -euo pipefail
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          if [[ -n "${GEOCONTROLS_TOKEN}" ]]; then
            git config --global url."https://x-access-token:${GEOCONTROLS_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi

      - name: Cache FreeCM seed repositories
        uses: actions/cache@v4
        with:
          path: build/dependency_seed_repos
          key: seeds-v2-${{ runner.os }}-${{ hashFiles('source_roots.lock.jsonc.in') }}
          restore-keys: seeds-v2-${{ runner.os }}-

      - name: Materialize source roots
        run: |
          set -euo pipefail
          if [[ -z "${QT_ROOT_DIR:-}" ]]; then
            echo "QT_ROOT_DIR was not set by install-qt-action" >&2
            exit 1
          fi
          python configs/source_root_workflow.py --init
          prefix_args=(--prefix-path "${QT_ROOT_DIR}" --prefix-path "${RUNNER_TEMP}/ci-prefix")
          path_args=(--path-entry "${QT_ROOT_DIR}/bin" --path-entry "${RUNNER_TEMP}/ci-prefix/bin")
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            prefix_args+=(--prefix-path "$(brew --prefix)")
            path_args+=(--path-entry "$(brew --prefix)/bin")
          fi
          python .github/scripts/prepare_ci_lock.py \
            --repo-root . \
            --platform "${{ matrix.platform }}" \
            "${prefix_args[@]}" \
            "${path_args[@]}"
          python configs/source_root_workflow.py --update
          python configs/source_roots.py show --format json
          python configs/source_roots.py resolve --format json
          python configs/source_roots.py verify
          python .github/scripts/prepare_ci_lock.py \
            --repo-root . \
            --check-preset \
            --preset "${{ matrix.preset }}" \
            "${path_args[@]}"

      - name: Configure Ravo
        run: cmake --preset "${{ matrix.preset }}" -DBUILD_TESTING=ON

      - name: Build Ravo
        run: cmake --build "build/${{ matrix.preset }}" --parallel

      - name: Test Ravo
        if: runner.os != 'Windows'
        run: ctest --test-dir "build/${{ matrix.preset }}" --output-on-failure --parallel 4

      - name: Test Ravo
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $qtBin = Join-Path $env:QT_ROOT_DIR "bin"
          $hostBin = Join-Path $env:RUNNER_TEMP "ci-prefix\bin"
          if (-not (Test-Path $qtBin)) {
            throw "Qt bin directory is missing: $qtBin"
          }
          $env:Path = "$qtBin;$hostBin;$env:Path"
          ctest --test-dir "build/${{ matrix.preset }}" --output-on-failure --parallel 4

      - name: Diagnose Windows test executables
        if: runner.os == 'Windows' && failure()
        shell: pwsh
        run: |
          $dumpbin = Get-Command dumpbin -ErrorAction SilentlyContinue
          $exes = @(
            "build/${{ matrix.preset }}/Ravo/tests/ravo_unit_tests.exe",
            "build/${{ matrix.preset }}/Ravo/tests/ravo_contract_tests.exe",
            "build/${{ matrix.preset }}/Ravo/tests/ravo_catalog_tests.exe"
          )
          foreach ($exe in $exes) {
            if (-not (Test-Path $exe)) {
              Write-Host "missing $exe"
              continue
            }
            Write-Host "=== $exe ==="
            if ($dumpbin) {
              & dumpbin.exe /dependents $exe
            }
            & $exe --gtest_list_tests
          }

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.preset }}-${{ runner.os }}
          path: |
            build/${{ matrix.preset }}/CMakeCache.txt
            build/${{ matrix.preset }}/CMakeFiles/CMakeConfigureLog.yaml
            build/${{ matrix.preset }}/Testing/Temporary/
          if-no-files-found: ignore
