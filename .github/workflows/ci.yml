name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  pull_request:
  workflow_dispatch:
    inputs:
      package_rehearsal:
        description: "Build and validate packages without tagging or publishing a GitHub Release"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.11.2"
  QT_QPA_PLATFORM: offscreen

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check whitespace
        run: python .github/scripts/check_changed_whitespace.py --repository-root .

      - name: Test changed-whitespace checker
        working-directory: .github/scripts
        run: python -m unittest test_check_changed_whitespace.py

      - name: Test packaged-runtime checker
        working-directory: Ravo/tools
        run: python -m unittest test_check_packaged_runtime.py

      - name: Test packaged evidence JSON serializer
        working-directory: Ravo/tools
        run: python -m unittest test_write_packaged_evidence_json.py

      - name: Test build-tree package verification unit helpers
        working-directory: Ravo/tools
        # Unit helpers only — the real create/import/probe/reopen workflow runs
        # via CTest against $<TARGET_FILE:ravo> after the CLI is built.
        run: python test_build_tree_package_verification.py --unit-only

      - name: Validate FreeCM project commands
        run: python FreeCM/tools/validate_repo_commands.py .

      - name: Check CI lock rewrite
        run: python .github/scripts/prepare_ci_lock.py --self-check

      - name: Run Ravo static contracts
        run: |
          set -euo pipefail
          python Ravo/tools/freeze_legacy_manifest.py --check
          python Ravo/tools/check_ravo_dependency_boundary.py
          python Ravo/tools/check_vertical_slice_plan.py
          python Ravo/tools/check_fixture_classification_ledger.py

  build:
    name: ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            preset: mac_clang_debug
            platform: mac
            host_packages: brew
            build_type: Debug
          - os: ubuntu-24.04
            preset: linux_clang_debug
            platform: linux
            host_packages: cmake
            build_type: Debug
          # MSVC Debug emits /Zi shared PDBs, which ccache reports as 100%
          # uncacheable. Release objects are cacheable and share the tag-package
          # ccache key. macOS/Linux CI stay Debug for CRT/assert coverage.
          - os: windows-2022
            preset: win_msvc_release
            platform: win
            host_packages: cmake-png
            build_type: Release
            runtime_dll: zlib.dll
          # Release smoke: non-empty subset; Debug full + win Release full stay required.
          - os: macos-15
            preset: mac_clang_release
            platform: mac
            host_packages: brew
            build_type: Release
            smoke_labels: "ravo-desktop-smoke|ravo-contract|ravo-catalog"
          - os: ubuntu-24.04
            preset: linux_clang_release
            platform: linux
            host_packages: cmake
            build_type: Release
            smoke_labels: "ravo-desktop-smoke|ravo-contract|ravo-catalog"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - name: Bootstrap CI environment
        uses: ./.github/actions/ci-bootstrap
        env:
          GEOCONTROLS_TOKEN: ${{ secrets.GEOCONTROLS_TOKEN }}
        with:
          platform: ${{ matrix.platform }}
          preset: ${{ matrix.preset }}
          host_packages: ${{ matrix.host_packages }}
          build_type: ${{ matrix.build_type }}
          runtime_dll: ${{ matrix.runtime_dll }}

      - name: Configure Ravo tests
        run: cmake --preset "${{ matrix.preset }}" -DBUILD_TESTING=ON

      - name: Build Ravo
        run: cmake --build "build/${{ matrix.preset }}" --parallel

      - name: Test Ravo
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          echo "preset=${{ matrix.preset }} build_type=${{ matrix.build_type }} sha=${GITHUB_SHA}"
          labels="${{ matrix.smoke_labels }}"
          if [[ -n "${labels}" ]]; then
            ctest --test-dir "build/${{ matrix.preset }}" --output-on-failure --parallel 4 -L "${labels}"
            count="$(ctest --test-dir "build/${{ matrix.preset }}" -N -L "${labels}" | awk '/Total Tests:/ {print $3}')"
            test "${count}" -gt 0
          else
            ctest --test-dir "build/${{ matrix.preset }}" --output-on-failure --parallel 4
          fi

      - name: Test Ravo
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $qtBin = Join-Path $env:QT_ROOT_DIR "bin"
          $hostBin = Join-Path $env:RUNNER_TEMP "ci-prefix\bin"
          if (-not (Test-Path $qtBin)) {
            throw "Qt bin directory is missing: $qtBin"
          }
          $env:Path = "$qtBin;$hostBin;$env:Path"
          ctest --test-dir "build/${{ matrix.preset }}" --output-on-failure --parallel 4

      - name: Diagnose Windows test executables
        if: runner.os == 'Windows' && failure()
        shell: pwsh
        run: |
          $dumpbin = Get-Command dumpbin -ErrorAction SilentlyContinue
          $exes = @(
            "build/${{ matrix.preset }}/Ravo/tests/ravo_unit_tests.exe",
            "build/${{ matrix.preset }}/Ravo/tests/ravo_contract_tests.exe",
            "build/${{ matrix.preset }}/Ravo/tests/ravo_catalog_tests.exe"
          )
          foreach ($exe in $exes) {
            if (-not (Test-Path $exe)) {
              Write-Host "missing $exe"
              continue
            }
            Write-Host "=== $exe ==="
            if ($dumpbin) {
              & dumpbin.exe /dependents $exe
            }
            & $exe --gtest_list_tests
          }

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: logs-${{ matrix.preset }}-${{ runner.os }}
          path: |
            build/${{ matrix.preset }}/CMakeCache.txt
            build/${{ matrix.preset }}/CMakeFiles/CMakeConfigureLog.yaml
            build/${{ matrix.preset }}/Testing/Temporary/
          if-no-files-found: ignore

  package:
    name: Package ${{ matrix.preset }}
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && inputs.package_rehearsal)
    needs:
      - static
      - build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            preset: mac_clang_release
            platform: mac
            host_packages: brew
            artifact_name: RavoStudio-macOS
            artifact_path: build/mac_clang_release/dist/*.dmg
          - os: ubuntu-24.04
            preset: linux_clang_release
            platform: linux
            host_packages: cmake
            artifact_name: RavoStudio-Linux
            artifact_path: |
              build/linux_clang_release/dist/*.AppImage
              build/linux_clang_release/package/*.deb
          - os: windows-2022
            preset: win_msvc_release
            platform: win
            host_packages: cmake-png
            runtime_dll: zlib.dll
            artifact_name: RavoStudio-Windows
            artifact_path: build/win_msvc_release/package/*.zip
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - name: Bootstrap CI environment
        uses: ./.github/actions/ci-bootstrap
        env:
          GEOCONTROLS_TOKEN: ${{ secrets.GEOCONTROLS_TOKEN }}
        with:
          platform: ${{ matrix.platform }}
          preset: ${{ matrix.preset }}
          host_packages: ${{ matrix.host_packages }}
          build_type: Release
          runtime_dll: ${{ matrix.runtime_dll }}

      - name: Configure Ravo package
        if: runner.os != 'Linux'
        run: cmake --preset "${{ matrix.preset }}" -DBUILD_TESTING=OFF

      - name: Install pinned AppImage tools
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          tool_dir="${RUNNER_TEMP}/ravo-appimage-tools"
          rm -rf "${tool_dir}"
          mkdir -p "${tool_dir}/bin"
          curl --fail --location --retry 3 \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage \
            --output "${tool_dir}/appimagetool-x86_64.AppImage"
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  ${tool_dir}/appimagetool-x86_64.AppImage" | sha256sum --check
          chmod +x "${tool_dir}/appimagetool-x86_64.AppImage"
          (
            cd "${tool_dir}"
            ./appimagetool-x86_64.AppImage --appimage-extract >/dev/null
          )
          mv "${tool_dir}/squashfs-root" "${tool_dir}/appimagetool-root"
          curl --fail --location --retry 3 \
            https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64 \
            --output "${tool_dir}/runtime-x86_64"
          echo "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  ${tool_dir}/runtime-x86_64" | sha256sum --check
          cat > "${tool_dir}/bin/appimagetool" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          exec "${tool_dir}/appimagetool-root/AppRun" \
            --runtime-file "${tool_dir}/runtime-x86_64" "\$@"
          EOF
          chmod +x "${tool_dir}/bin/appimagetool"
          echo "${tool_dir}/bin" >> "$GITHUB_PATH"
          echo "ARCH=x86_64" >> "$GITHUB_ENV"

      - name: Configure Ravo Linux package
        if: runner.os == 'Linux'
        run: cmake --preset "${{ matrix.preset }}" -DBUILD_TESTING=OFF

      - name: Package Ravo with FreeCM
        run: cmake --build "build/${{ matrix.preset }}" --target RavoPackage --parallel

      - name: Validate packaged runtime out of tree
        run: |
          set -euo pipefail
          shopt -s nullglob
          evidence_root="${RUNNER_TEMP}/ravo-packaged-evidence"
          rm -rf "${evidence_root}"
          mkdir -p "${evidence_root}"
          # Publish the evidence directory before validation so always() upload
          # still finds files when a checker fails under set -e.
          echo "PACKAGED_EVIDENCE_DIR=${evidence_root}" >> "$GITHUB_ENV"
          artifacts=( ${{ matrix.artifact_path }} )
          if [[ ${#artifacts[@]} -eq 0 ]]; then
            python3 Ravo/tools/write_packaged_evidence_json.py \
              --output "${evidence_root}/missing-artifacts.evidence.json" \
              --field type=ravo.packaged_evidence \
              --field-json version=1 \
              --field status=FAIL \
              --field "reason=no artifacts matched" \
              --field "pattern=${{ matrix.artifact_path }}" \
              --field source_sha="${GITHUB_SHA}" \
              --field run_id="${GITHUB_RUN_ID}" \
              --field run_attempt="${GITHUB_RUN_ATTEMPT}"
            echo "ERROR: no artifacts matched ${{ matrix.artifact_path }}"
            exit 1
          fi
          work="${RUNNER_TEMP}/ravo-packaged-runtime"
          rm -rf "${work}"
          mkdir -p "${work}"
          status=0
          for artifact in "${artifacts[@]}"; do
            base="$(basename "${artifact}")"
            evidence="${evidence_root}/${base}.evidence.json"
            if command -v sha256sum >/dev/null 2>&1; then
              digest="$(sha256sum "${artifact}" | awk '{print $1}')"
            else
              digest="$(shasum -a 256 "${artifact}" | awk '{print $1}')"
            fi
            meta="${evidence_root}/${base}.meta.json"
            python3 Ravo/tools/write_packaged_evidence_json.py \
              --output "${meta}" \
              --field "artifact=${base}" \
              --field "digest_sha256=${digest}" \
              --field "source_sha=${GITHUB_SHA}" \
              --field "run_id=${GITHUB_RUN_ID}" \
              --field "run_attempt=${GITHUB_RUN_ATTEMPT}"
            if ! python3 Ravo/tools/check_packaged_runtime.py "${artifact}" \
              --workdir "${work}/${base}" \
              --repo-root "${GITHUB_WORKSPACE}" \
              --evidence-json "${evidence}" \
              --artifact-basename "${base}" \
              --source-sha "${GITHUB_SHA}" \
              --run-id "${GITHUB_RUN_ID}" \
              --run-attempt "${GITHUB_RUN_ATTEMPT}" \
              --require-smoke; then
              status=1
              if [[ ! -f "${evidence}" ]]; then
                python3 Ravo/tools/write_packaged_evidence_json.py \
                  --output "${evidence}" \
                  --field type=ravo.packaged_evidence \
                  --field-json version=1 \
                  --field status=FAIL \
                  --field "reason=checker exited without evidence" \
                  --field "artifact=${base}" \
                  --field "digest_sha256=${digest}" \
                  --field "source_sha=${GITHUB_SHA}" \
                  --field run_id="${GITHUB_RUN_ID}" \
                  --field run_attempt="${GITHUB_RUN_ATTEMPT}"
              fi
            fi
          done
          # Validate every uploaded evidence/meta file is real JSON before upload.
          shopt -s nullglob
          evidence_files=("${evidence_root}"/*.evidence.json "${evidence_root}"/*.meta.json)
          if [[ ${#evidence_files[@]} -eq 0 ]]; then
            echo "ERROR: no packaged evidence JSON produced"
            exit 1
          fi
          python3 Ravo/tools/write_packaged_evidence_json.py --validate "${evidence_files[@]}"
          exit "${status}"

      - name: Upload packaged runtime evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: packaged-runtime-evidence-${{ matrix.preset }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ravo-packaged-evidence/*.evidence.json
            ${{ runner.temp }}/ravo-packaged-evidence/*.meta.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload Ravo package
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: package-logs-${{ matrix.preset }}-${{ runner.os }}
          path: |
            build/${{ matrix.preset }}/CMakeCache.txt
            build/${{ matrix.preset }}/CMakeFiles/CMakeConfigureLog.yaml
            build/${{ matrix.preset }}/package/*.json
          if-no-files-found: ignore

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    # Rehearsal package runs never create/update tags or GitHub Releases.
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download packaged artifacts
        run: |
          set -euo pipefail
          gh run download "${GITHUB_RUN_ID}" \
            --dir release-assets \
            --name RavoStudio-macOS \
            --name RavoStudio-Windows \
            --name RavoStudio-Linux

      - name: Create GitHub Release
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(
            find release-assets -type f \
              \( -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.deb' \) \
              -print0
          )
          if [[ "${#assets[@]}" -ne 4 ]]; then
            printf 'expected exactly 4 release assets, found %s\n' "${#assets[@]}" >&2
            printf '%s\n' "${assets[@]}" >&2
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
            --verify-tag \
            --title "Ravo ${GITHUB_REF_NAME}" \
            --generate-notes
