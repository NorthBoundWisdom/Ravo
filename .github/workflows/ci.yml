name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  pull_request:
  workflow_dispatch:
    inputs:
      package_rehearsal:
        description: "Build and validate packages without tagging or publishing a GitHub Release"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.11.2"
  QT_QPA_PLATFORM: offscreen

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      tagged: ${{ steps.revision.outputs.tagged }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - name: Identify tagged revision
        id: revision
        shell: bash
        run: |
          set -euo pipefail
          tags="$(git tag --points-at HEAD)"
          if [[ -n "${tags}" ]]; then
            echo "tagged=true" >> "$GITHUB_OUTPUT"
          else
            echo "tagged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check whitespace
        run: python .github/scripts/check_changed_whitespace.py --repository-root .

      - name: Test changed-whitespace checker
        working-directory: .github/scripts
        run: python -m unittest test_check_changed_whitespace.py test_check_ccache.py

      - name: Test packaged-runtime checker
        working-directory: Ravo/tools
        run: python -m unittest test_check_packaged_runtime.py test_packaged_native_smoke.py

      - name: Test packaged evidence JSON serializer
        working-directory: Ravo/tools
        run: python -m unittest test_write_packaged_evidence_json.py

      - name: Test build-tree package verification unit helpers
        working-directory: Ravo/tools
        # Unit helpers only — the real create/import/probe/reopen workflow runs
        # via CTest against $<TARGET_FILE:ravo> after the CLI is built.
        run: python test_build_tree_package_verification.py --unit-only

      - name: Test FFmpeg runtime resolution
        run: python Ravo/tools/test_video_dependencies.py

      - name: Validate FreeCM project commands
        run: python FreeCM/tools/validate_repo_commands.py .

      - name: Check CI lock rewrite
        run: python .github/scripts/prepare_ci_lock.py --self-check

      - name: Run Ravo static contracts
        run: |
          set -euo pipefail
          python Ravo/tools/freeze_legacy_manifest.py --check
          python Ravo/tools/check_ravo_dependency_boundary.py
          python Ravo/tools/check_vertical_slice_plan.py
          python Ravo/tools/check_fixture_classification_ledger.py

  build:
    name: ${{ matrix.preset }} (${{ matrix.os }})
    # Tags/rehearsals validate inside the Release package jobs. Atomic main+tag
    # pushes also avoid launching a second Debug matrix for the same revision.
    if: >-
      !startsWith(github.ref, 'refs/tags/') &&
      !(github.event_name == 'workflow_dispatch' && inputs.package_rehearsal) &&
      !(github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.static.outputs.tagged == 'true')
    needs: static
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            preset: mac_clang_debug
            platform: mac
            host_packages: brew
            build_type: Debug
          - os: ubuntu-24.04
            preset: linux_clang_debug
            platform: linux
            host_packages: cmake
            build_type: Debug
          # Keep Debug assertions on ordinary macOS/Linux changes. Windows
          # Release avoids uncacheable /Zi PDBs and shares the package cache.
          - os: windows-2022
            preset: win_msvc_release
            platform: win
            host_packages: cmake-png
            build_type: Release
            runtime_dll: zlib.dll
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - name: Bootstrap CI environment
        id: bootstrap
        uses: ./.github/actions/ci-bootstrap
        env:
          GEOCONTROLS_TOKEN: ${{ secrets.GEOCONTROLS_TOKEN }}
        with:
          platform: ${{ matrix.platform }}
          preset: ${{ matrix.preset }}
          host_packages: ${{ matrix.host_packages }}
          build_type: ${{ matrix.build_type }}
          runtime_dll: ${{ matrix.runtime_dll }}

      - name: Configure Ravo tests
        run: cmake --preset "${{ matrix.preset }}" -DBUILD_TESTING=ON

      - name: Build Ravo
        run: cmake --build "build/${{ matrix.preset }}" --parallel

      - name: Verify compiler cache usage
        run: python .github/scripts/check_ccache.py --build-dir "build/${{ matrix.preset }}"

      - name: Save compiler cache after build
        uses: actions/cache/save@v5
        with:
          # Match ccache-action's absolute path and ccache- restore prefix.
          path: ${{ steps.bootstrap.outputs.ccache-directory }}
          key: ccache-${{ matrix.preset }}-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Test Ravo
        uses: ./.github/actions/ci-test
        with:
          preset: ${{ matrix.preset }}

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: logs-${{ matrix.preset }}-${{ runner.os }}-${{ runner.arch }}
          path: |
            build/${{ matrix.preset }}/CMakeCache.txt
            build/${{ matrix.preset }}/CMakeFiles/CMakeConfigureLog.yaml
            build/${{ matrix.preset }}/Testing/Temporary/
          if-no-files-found: ignore

  package:
    name: Package ${{ matrix.preset }} (${{ matrix.os }})
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && inputs.package_rehearsal)
    needs:
      - static
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            preset: mac_clang_release
            platform: mac
            host_packages: brew
            artifact_name: RavoStudio-macOS-arm64
            artifact_path: build/mac_clang_release/dist/*-arm64-macOS.dmg
          - os: macos-15-intel
            preset: mac_clang_release
            platform: mac
            host_packages: brew
            artifact_name: RavoStudio-macOS-x86_64
            artifact_path: build/mac_clang_release/dist/*-x86_64-macOS.dmg
          - os: ubuntu-24.04
            preset: linux_clang_release
            platform: linux
            host_packages: cmake
            artifact_name: RavoStudio-Linux-x86_64
            appimage_arch: x86_64
            appimage_tool_sha256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
            appimage_runtime_sha256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
            artifact_path: |
              build/linux_clang_release/dist/*-x86_64-Linux.AppImage
              build/linux_clang_release/package/*-x86_64-Linux.deb
          - os: ubuntu-24.04-arm
            preset: linux_clang_release
            platform: linux
            host_packages: cmake
            artifact_name: RavoStudio-Linux-aarch64
            appimage_arch: aarch64
            appimage_tool_sha256: f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158
            appimage_runtime_sha256: 00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444
            artifact_path: |
              build/linux_clang_release/dist/*-aarch64-Linux.AppImage
              build/linux_clang_release/package/*-aarch64-Linux.deb
          - os: windows-2022
            preset: win_msvc_release
            platform: win
            host_packages: cmake-png
            runtime_dll: zlib.dll
            artifact_name: RavoStudio-Windows-x86_64
            artifact_path: build/win_msvc_release/package/*-x86_64-Windows.zip
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - name: Bootstrap CI environment
        id: bootstrap
        uses: ./.github/actions/ci-bootstrap
        env:
          GEOCONTROLS_TOKEN: ${{ secrets.GEOCONTROLS_TOKEN }}
        with:
          platform: ${{ matrix.platform }}
          preset: ${{ matrix.preset }}
          host_packages: ${{ matrix.host_packages }}
          build_type: Release
          runtime_dll: ${{ matrix.runtime_dll }}

      - name: Install pinned AppImage tools
        if: runner.os == 'Linux'
        env:
          APPIMAGE_ARCH: ${{ matrix.appimage_arch }}
          APPIMAGE_TOOL_SHA256: ${{ matrix.appimage_tool_sha256 }}
          APPIMAGE_RUNTIME_SHA256: ${{ matrix.appimage_runtime_sha256 }}
        run: |
          set -euo pipefail
          tool_dir="${RUNNER_TEMP}/ravo-appimage-tools"
          rm -rf "${tool_dir}"
          mkdir -p "${tool_dir}/bin"
          curl --fail --location --retry 3 \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-${APPIMAGE_ARCH}.AppImage" \
            --output "${tool_dir}/appimagetool.AppImage"
          echo "${APPIMAGE_TOOL_SHA256}  ${tool_dir}/appimagetool.AppImage" | sha256sum --check
          chmod +x "${tool_dir}/appimagetool.AppImage"
          (
            cd "${tool_dir}"
            ./appimagetool.AppImage --appimage-extract >/dev/null
          )
          mv "${tool_dir}/squashfs-root" "${tool_dir}/appimagetool-root"
          curl --fail --location --retry 3 \
            "https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-${APPIMAGE_ARCH}" \
            --output "${tool_dir}/runtime"
          echo "${APPIMAGE_RUNTIME_SHA256}  ${tool_dir}/runtime" | sha256sum --check
          cat > "${tool_dir}/bin/appimagetool" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          exec "${tool_dir}/appimagetool-root/AppRun" \
            --runtime-file "${tool_dir}/runtime" "\$@"
          EOF
          chmod +x "${tool_dir}/bin/appimagetool"
          echo "${tool_dir}/bin" >> "$GITHUB_PATH"
          echo "ARCH=${APPIMAGE_ARCH}" >> "$GITHUB_ENV"

      - name: Configure Release tests and package
        run: cmake --preset "${{ matrix.preset }}" -DBUILD_TESTING=ON

      - name: Build Ravo Release
        run: cmake --build "build/${{ matrix.preset }}" --parallel

      - name: Verify compiler cache usage
        run: python .github/scripts/check_ccache.py --build-dir "build/${{ matrix.preset }}"

      - name: Save compiler cache after build
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.bootstrap.outputs.ccache-directory }}
          key: ccache-${{ matrix.preset }}-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Test Release before packaging
        uses: ./.github/actions/ci-test
        with:
          preset: ${{ matrix.preset }}

      - name: Package Ravo with FreeCM
        run: cmake --build "build/${{ matrix.preset }}" --target RavoPackage --parallel

      - name: Validate packaged runtime out of tree
        run: |
          set -euo pipefail
          shopt -s nullglob
          evidence_root="${RUNNER_TEMP}/ravo-packaged-evidence"
          rm -rf "${evidence_root}"
          mkdir -p "${evidence_root}"
          # Publish the evidence directory before validation so always() upload
          # still finds files when a checker fails under set -e.
          echo "PACKAGED_EVIDENCE_DIR=${evidence_root}" >> "$GITHUB_ENV"
          artifacts=( ${{ matrix.artifact_path }} )
          if [[ ${#artifacts[@]} -eq 0 ]]; then
            python3 Ravo/tools/write_packaged_evidence_json.py \
              --output "${evidence_root}/missing-artifacts.evidence.json" \
              --field type=ravo.packaged_evidence \
              --field-json version=1 \
              --field status=FAIL \
              --field "reason=no artifacts matched" \
              --field "pattern=${{ matrix.artifact_path }}" \
              --field source_sha="${GITHUB_SHA}" \
              --field run_id="${GITHUB_RUN_ID}" \
              --field run_attempt="${GITHUB_RUN_ATTEMPT}"
            echo "ERROR: no artifacts matched ${{ matrix.artifact_path }}"
            exit 1
          fi
          work="${RUNNER_TEMP}/ravo-packaged-runtime"
          rm -rf "${work}"
          mkdir -p "${work}"
          status=0
          for artifact in "${artifacts[@]}"; do
            base="$(basename "${artifact}")"
            evidence="${evidence_root}/${base}.evidence.json"
            if command -v sha256sum >/dev/null 2>&1; then
              digest="$(sha256sum "${artifact}" | awk '{print $1}')"
            else
              digest="$(shasum -a 256 "${artifact}" | awk '{print $1}')"
            fi
            meta="${evidence_root}/${base}.meta.json"
            python3 Ravo/tools/write_packaged_evidence_json.py \
              --output "${meta}" \
              --field "artifact=${base}" \
              --field "digest_sha256=${digest}" \
              --field "source_sha=${GITHUB_SHA}" \
              --field "run_id=${GITHUB_RUN_ID}" \
              --field "run_attempt=${GITHUB_RUN_ATTEMPT}"
            if ! python3 Ravo/tools/check_packaged_runtime.py "${artifact}" \
              --workdir "${work}/${base}" \
              --repo-root "${GITHUB_WORKSPACE}" \
              --evidence-json "${evidence}" \
              --artifact-basename "${base}" \
              --source-sha "${GITHUB_SHA}" \
              --run-id "${GITHUB_RUN_ID}" \
              --run-attempt "${GITHUB_RUN_ATTEMPT}" \
              --require-smoke; then
              status=1
              if [[ ! -f "${evidence}" ]]; then
                python3 Ravo/tools/write_packaged_evidence_json.py \
                  --output "${evidence}" \
                  --field type=ravo.packaged_evidence \
                  --field-json version=1 \
                  --field status=FAIL \
                  --field "reason=checker exited without evidence" \
                  --field "artifact=${base}" \
                  --field "digest_sha256=${digest}" \
                  --field "source_sha=${GITHUB_SHA}" \
                  --field run_id="${GITHUB_RUN_ID}" \
                  --field run_attempt="${GITHUB_RUN_ATTEMPT}"
              fi
            fi
          done
          # Validate every uploaded evidence/meta file is real JSON before upload.
          shopt -s nullglob
          evidence_files=("${evidence_root}"/*.evidence.json "${evidence_root}"/*.meta.json)
          if [[ ${#evidence_files[@]} -eq 0 ]]; then
            echo "ERROR: no packaged evidence JSON produced"
            exit 1
          fi
          python3 Ravo/tools/write_packaged_evidence_json.py --validate "${evidence_files[@]}"
          exit "${status}"

      - name: Upload packaged runtime evidence
        if: always() && env.PACKAGED_EVIDENCE_DIR != ''
        uses: actions/upload-artifact@v6
        with:
          name: packaged-runtime-evidence-${{ matrix.preset }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ravo-packaged-evidence/*.evidence.json
            ${{ runner.temp }}/ravo-packaged-evidence/*.meta.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload Ravo package
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: package-logs-${{ matrix.preset }}-${{ runner.os }}-${{ runner.arch }}
          path: |
            build/${{ matrix.preset }}/CMakeCache.txt
            build/${{ matrix.preset }}/CMakeFiles/CMakeConfigureLog.yaml
            build/${{ matrix.preset }}/package/*.json
            build/${{ matrix.preset }}/Testing/Temporary/
          if-no-files-found: ignore

  package-smoke:
    name: Clean package startup (${{ matrix.artifact }})
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            artifact: RavoStudio-macOS-arm64
            count: 1
          - os: macos-15-intel
            artifact: RavoStudio-macOS-x86_64
            count: 1
          - os: ubuntu-24.04
            artifact: RavoStudio-Linux-x86_64
            count: 2
          - os: ubuntu-24.04-arm
            artifact: RavoStudio-Linux-aarch64
            count: 2
          - os: windows-2022
            artifact: RavoStudio-Windows-x86_64
            count: 1
    defaults:
      run:
        shell: bash
    steps:
      # Separate runner: no ci-bootstrap, Qt SDK, source-root or compiler cache.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: Ravo/tools

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Linux desktop runtime and virtual display
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb xauth dbus-x11 binutils libfuse2t64 \
            libegl1 libgl1 libopengl0 libfontconfig1 libfreetype6 libglib2.0-0t64 \
            libdbus-1-3 libx11-6 libx11-xcb1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render0 libxcb-render-util0 libxcb-shape0 \
            libxcb-shm0 libxcb-sync1 libxcb-util1 libxcb-xfixes0 libxcb-xkb1 \
            libpipewire-0.3-0 libva2 libva-drm2 libva-x11-2

      - name: Download final packages
        uses: actions/download-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/downloaded-packages

      - name: Launch every final package on a fresh runner
        run: |
          set -euo pipefail
          artifacts=()
          while IFS= read -r -d '' file; do artifacts+=("${file}"); done < <(
            find "${RUNNER_TEMP}/downloaded-packages" -type f \
              \( -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.deb' \) -print0
          )
          test "${#artifacts[@]}" -eq "${{ matrix.count }}"
          status=0
          for artifact in "${artifacts[@]}"; do
            base="$(basename "${artifact}")"
            command=(python Ravo/tools/check_packaged_runtime.py "${artifact}"
              --workdir "${RUNNER_TEMP}/clean-startup/${base}"
              --repo-root "${GITHUB_WORKSPACE}"
              --require-native-smoke
              --evidence-json "${RUNNER_TEMP}/native-evidence/${base}.evidence.json"
              --source-sha "${GITHUB_SHA}" --run-id "${GITHUB_RUN_ID}"
              --run-attempt "${GITHUB_RUN_ATTEMPT}")
            if [[ "${RUNNER_OS}" == Linux ]]; then
              command=(xvfb-run -a -s '-screen 0 1280x1024x24' dbus-run-session -- "${command[@]}")
            fi
            "${command[@]}" || status=1
          done
          exit "${status}"

      - name: Upload clean startup evidence and loader logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: clean-startup-${{ matrix.artifact }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-evidence/*.json
            ${{ runner.temp }}/clean-startup/*/native-*.log
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    # Rehearsal package runs never create/update tags or GitHub Releases.
    needs: [package, package-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download packaged artifacts
        run: |
          set -euo pipefail
          gh run download "${GITHUB_RUN_ID}" \
            --dir release-assets \
            --name RavoStudio-macOS-arm64 \
            --name RavoStudio-macOS-x86_64 \
            --name RavoStudio-Windows-x86_64 \
            --name RavoStudio-Linux-x86_64 \
            --name RavoStudio-Linux-aarch64

      - name: Create GitHub Release
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(
            find release-assets -type f \
              \( -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.deb' \) \
              -print0
          )
          if [[ "${#assets[@]}" -ne 7 ]]; then
            printf 'expected exactly 7 release assets, found %s\n' "${#assets[@]}" >&2
            printf '%s\n' "${assets[@]}" >&2
            exit 1
          fi
          # Count alone cannot distinguish a missing architecture/format from duplicates.
          for suffix in arm64-macOS.dmg x86_64-macOS.dmg x86_64-Windows.zip \
                        x86_64-Linux.AppImage x86_64-Linux.deb \
                        aarch64-Linux.AppImage aarch64-Linux.deb; do
            matches=()
            # Linux artifacts retain dist/ and package/ below their artifact root.
            for asset in "${assets[@]}"; do
              if [[ "${asset##*/}" == "RavoStudio-${GITHUB_REF_NAME#v}-${suffix}" ]]; then
                matches+=("${asset}")
              fi
            done
            if [[ "${#matches[@]}" -ne 1 ]]; then
              echo "Expected exactly one release asset for ${suffix}" >&2
              exit 1
            fi
          done
          gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
            --verify-tag \
            --title "Ravo ${GITHUB_REF_NAME}" \
            --generate-notes
