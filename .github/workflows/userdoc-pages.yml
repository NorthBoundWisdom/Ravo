name: Publish user documentation

on:
  push:
    branches:
      - main
    paths:
      - userdoc/**
      - .github/workflows/userdoc-pages.yml
  pull_request:
    paths:
      - userdoc/**
      - .github/workflows/userdoc-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build user documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: userdoc/requirements.txt

      - name: Install documentation dependencies
        run: python -m pip install --disable-pip-version-check -r userdoc/requirements.txt

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build handbook
        env:
          NO_MKDOCS_2_WARNING: "true"
        run: python -m mkdocs build --config-file userdoc/mkdocs.yml --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: userdoc/site

  deploy:
    name: Deploy user documentation
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
